<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Yu-Gi-Oh! Login</title>
    <link rel="stylesheet" href="../com/example/yugioh/static/MainMenu.css">
</head>
<body>

<div class="login-container">
    <img src="../com/example/yugioh/images/dn-logo.0468c98.png" alt="Dueling Nexus Logo" class="logo">

    <h2>ACCOUNT LOGIN</h2>

    <form th:action="@{/auth/login}" method="post" class="login-form">
        <div class="input-group">
            <label for="email"></label><input type="email" id="email" name="email" placeholder="EMAIL" required>
        </div>

        <div class="input-group">
            <label for="password"></label><input type="password" id="password" name="password" placeholder="PASSWORD"
                                                 required>
        </div>

        <div class="options">
            <label>
                <input type="checkbox" name="remember"> Stay logged in
            </label>
            <a href="#" class="forgot">Forgot password?</a>
        </div>

        <div class="buttons">
            <button type="button" class="btn btn-register" onclick="window.location.href='/register'">REGISTER</button>
            <button type="submit" class="btn btn-login">LOGIN</button>
        </div>
    </form>
</div>

</body>
</html>
